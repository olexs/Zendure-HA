name: HACS Action

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    # Skip on forks — HACS validation requires upstream-only configuration.
    if: github.repository == 'zendure/zendure-ha'
    name: HACS Action
    runs-on: ubuntu-latest
    steps:
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: "integration"
